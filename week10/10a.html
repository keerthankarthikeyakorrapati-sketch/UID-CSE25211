<html>
<head>
<title>Sign of Product</title>
</head>
<body>

<script>
function checkSign(a, b, c) {
let product = a * b * c;
if (product > 0) {alert("The sign is + (Positive)");
} else if (product < 0) {
alert("The sign is - (Negative)");
} else {
alert("The product is 0");
}
}
// Example values
checkSign(3, -7, 2);
</script>
</body>
</html>
